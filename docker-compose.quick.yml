version: '3.8'

services:
  callytics-quick:
    build:
      context: .
      dockerfile: Dockerfile.quick
    container_name: callytics-quick
    ports:
      - "8000:8000"
    volumes:
      # 오디오 파일 마운트
      - ./audio:/app/audio
      # 데이터베이스 영속성
      - ./data:/app/.db
      # 로그 파일
      - ./logs:/app/logs
      # 임시 파일
      - ./temp:/app/.temp
    environment:
      - PYTHONPATH=/app
    restart: "no" 